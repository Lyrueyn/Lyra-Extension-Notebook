<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记本</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo">笔记</span>
        <input id="notebookTitle" class="notebook-title" type="text" value="未命名笔记本" spellcheck="false">
      </div>
      <div class="notes">
        <select id="noteSelect" class="note-select" title="切换笔记"></select>
        <input id="noteTitle" class="note-title" type="text" value="" placeholder="笔记标题" spellcheck="false">
        <button id="moveNoteUpBtn" class="icon-btn" type="button" title="笔记上移">↑</button>
        <button id="moveNoteDownBtn" class="icon-btn" type="button" title="笔记下移">↓</button>
        <button id="duplicateNoteBtn" class="icon-btn" type="button" title="复制笔记">⧉</button>
        <button id="newNoteBtn" class="ghost" type="button">＋ 笔记</button>
        <button id="deleteNoteBtn" class="ghost" type="button">删除</button>
      </div>
      <div class="toolbar">
        <div id="readControls" class="read-controls" hidden>
          <button id="readFontDownBtn" class="icon-btn" type="button" title="字号减小">A−</button>
          <span id="readFontLabel" class="read-font-label">16</span>
          <button id="readFontUpBtn" class="icon-btn" type="button" title="字号增大">A+</button>
          <select id="readTheme" class="mini-select" title="阅读主题">
            <option value="light">浅色</option>
            <option value="sepia">护眼</option>
            <option value="dark">深色</option>
          </select>
          <select id="readWidth" class="mini-select" title="阅读宽度">
            <option value="680">窄</option>
            <option value="860">中</option>
            <option value="1100">宽</option>
          </select>
        </div>
        <div class="mode-switch">
          <button id="editModeBtn" class="mode active" type="button">编辑</button>
          <button id="readModeBtn" class="mode" type="button">阅读</button>
        </div>
        <span id="saveState" class="save-state">已保存</span>
        <button id="saveBtn" class="ghost" type="button">保存</button>
      </div>
    </header>
    <main class="content">
      <iframe id="editorFrame" class="editor-frame" title="HTML 编辑器"></iframe>
      <iframe id="readFrame" class="read-frame" title="HTML 阅读" sandbox="allow-same-origin allow-scripts allow-forms allow-modals" hidden></iframe>
    </main>
  </div>
  <div id="errorMask" class="error-mask" hidden>
    <div class="error-card">
      <h3>笔记本无法打开</h3>
      <p id="errorText"></p>
      <button id="errorClose" class="ghost" type="button">关闭</button>
    </div>
  </div>
  <script src="vendor/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
